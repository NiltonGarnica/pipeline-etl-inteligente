
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline ETL Inteligente</title>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            margin: 0;
            padding: 40px 20px;
            color: #202938;
        }

        main {
            max-width: 850px;
            margin: auto;
        }

        section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
            box-shadow: 0 2px 10px #0000000a;
        }

        textarea {
            box-sizing: border-box;
            width: 100%;
            min-height: 130px;
            padding: 12px;
            border: 1px solid #ccd3dc;
            border-radius: 8px;
            font: inherit;
        }

        button {
            margin-top: 14px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
        }

        .registro {
            border-bottom: 1px solid #e4e7ec;
            padding: 14px 0;
        }

        .registro:last-child {
            border-bottom: none;
        }

        .detalle {
            color: #566275;
        }

        .error {
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <main>
        <h1>Pipeline ETL Inteligente</h1>
        <p>Analiza reseñas de clientes utilizando inteligencia artificial.</p>

        <section>
            <h2>Analizar narrativa</h2>

            <form
                hx-post="/web/process"
                hx-target="#resultado"
                hx-swap="innerHTML"
                hx-indicator="#cargando"
            >
                <textarea
                    name="texto"
                    placeholder="Escribe aquí la reseña del cliente..."
                    required
                    minlength="1"
                ></textarea>

                <button type="submit">Analizar con IA</button>
                <span id="cargando" class="htmx-indicator">
                    Analizando...
                </span>
            </form>

            <div id="resultado"></div>
        </section>

        <section>
            <h2>Historial de análisis</h2>

            <div id="historial">
                {% include "historial.html" %}
            </div>

            <button
                hx-get="/web/registros"
                hx-target="#historial"
                hx-swap="innerHTML"
            >
                Actualizar historial
            </button>
        </section>
    </main>
</body>
</html>
